name: Update JAX DNA sentiment index

on:
  schedule:
    - cron: "0 10 * * *"     # 06:00 Eastern (10:00 UTC) every day
  workflow_dispatch:         # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jax-dna-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          pip install -r requirements.txt
          # Remove the next two lines to run VADER only (faster, no model download).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Cache the RoBERTa model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cardiffnlp-roberta-sentiment

      - name: Collect, score, export, build dashboard
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python run.py all

      - name: Commit updated data and dashboard
        run: |
          git config user.name "jax-dna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jaxdna.sqlite data/export.json dashboard/index.html
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push

      - name: Publish dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
